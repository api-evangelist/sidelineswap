aid: sidelineswap
name: SidelineSwap
description: >-
  SidelineSwap is an online marketplace where athletes buy and sell new and used
  sports equipment across hockey, baseball, softball, lacrosse, football, golf,
  soccer, skiing, snowboarding and more. Sellers list gear for free, while
  SidelineSwap handles payments, prepaid shipping labels and buyer protection,
  and pro shops and teams manage consignment inventory. The company operates a
  developer portal at developer.sidelineswap.com with a login-gated Inventory API
  plus REST services on api.sidelineswap.com for identity, commerce and secure
  payments, enabling partners and pro sellers to sync listings programmatically.
